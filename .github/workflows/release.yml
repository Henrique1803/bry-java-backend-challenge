name: Release

# Publica uma versão ao enviar uma tag no formato vX.Y.Z (a mesma versão do pom.xml)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  github-release:
    name: Release no GitHub
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Baixar o jar testado pela CI
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: dist

      - name: Conferir se a tag corresponde à versão do projeto
        run: |
          jar="dist/bry-java-backend-challenge-${GITHUB_REF_NAME#v}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão do pom.xml (jar gerado: $(ls dist))"
            exit 1
          fi

      - name: Reunir os artefatos de entrega
        run: cp artifacts/doc.txt.sha512 artifacts/doc.txt.p7s dist/

      - name: Publicar a release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  docker-image:
    name: Imagem Docker no GHCR
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome e tags da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # Os testes já rodaram na CI; a imagem reaproveita o cache das camadas construídas lá
      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SKIP_TESTS=true
          cache-from: type=gha

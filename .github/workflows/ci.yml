name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar, testar e gerar cobertura
        run: ./mvnw -B verify

      - name: Executar as etapas do desafio (modo CLI)
        run: java -jar target/bry-java-backend-challenge-*.jar --spring.profiles.active=cli

      - name: Conferir o hash da etapa 1 com o sha512sum
        run: sha512sum -c artifacts/doc.txt.sha512

      # Verificação independente da etapa 2: assinatura e cadeia de confiança conferidas pelo OpenSSL
      - name: Conferir a assinatura da etapa 2 com o OpenSSL
        run: |
          for certificate in resources/cadeia/*.cer; do
            openssl x509 -inform DER -in "$certificate"
          done > "$RUNNER_TEMP/cadeia.pem"
          openssl cms -verify -inform DER -in artifacts/doc.txt.p7s \
            -CAfile "$RUNNER_TEMP/cadeia.pem" -purpose any -out "$RUNNER_TEMP/conteudo.txt"
          cmp "$RUNNER_TEMP/conteudo.txt" resources/arquivos/doc.txt

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Publicar jar
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/bry-java-backend-challenge-*.jar

  docker:
    name: Imagem Docker e smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Os testes já rodaram no job anterior; aqui o foco é validar a imagem.
      - name: Construir imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bry-java-backend-challenge:ci
          build-args: SKIP_TESTS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir container e verificar health check
        run: |
          docker run -d --name app -p 8080:8080 bry-java-backend-challenge:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "Tentativa $attempt: $status"
            if [ "$status" = "healthy" ]; then
              curl -fsS http://localhost:8080/actuator/health
              exit 0
            fi
            sleep 2
          done
          echo "A aplicação não ficou saudável a tempo"
          docker logs app
          exit 1

      - name: Remover container
        if: always()
        run: docker rm -f app || true
